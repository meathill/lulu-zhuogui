intro:
  image: res://assets/stills/level-10.png
  lines:
    - "林小禾的卧室。她盖着被子，呼吸灯很弱。天花板后面是那条黑巷。"
    - "老周：符贴门缝窗沿。定神顶住床边那团，五雷往地上引。"
