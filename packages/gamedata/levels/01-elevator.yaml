# 逐步口播。等点击时威胁时钟停住，第一只细祟大约 16 秒出现在门下缝。
tutorial:
  look:
    - "监控就这一路，轿厢里头。门框脚底下那条黑缝叫门下缝，鬼渣爱从这儿往广告屏上爬。"
    - "你点一下那条缝，算你看清楚了。"
  lookHint: "先看门下缝，门框脚底下那条黑的。"
  place: "底下点「镇守」，再点门下缝，符就粘上去。画潦草点没事，系统认得出来就行。"
  needTool: "先把镇守选上。光点缝，符还在口袋里。"
  regen:
    - "顶上那条是符力。贴一张掉一截，歇一会儿它自己往回长。"
    - "你点一下那条，看数字往上走。"
  blocked: "进来一个。门下缝的符把它拦住了，过不去，在那儿慢慢磨。你看着就行。"
  kicked:
    - "脚扫到了，门下缝的符被踢掉。"
    - "位子空了，再选镇守补一张。"
  kickedBare: "门下缝这张不在了。人进出会用脚扫掉，你先把镇守补回去。"
  second:
    - "光堵门底下不够。侧面门缝、楼层显示板那条缝，都是路。"
    - "门缝或者楼层板缝，再贴一张。"
  tear: "贴歪了就选底下的「撕符」，点那张揭下来，空位子再贴。这单还在，重来就行。"
  tearWrong: "这张贴偏了。选撕符点它揭掉，再往我说的缝上贴。"
  wave:
    - "这一波厚，里头还有块沉一点的鬼渣，爱趴在广告屏前。"
    - "发冷乘客盯好，攒到三个，这班就算交了。"
outro:
  image: res://assets/stills/level-01.png
  lines:
    - "鬼渣散了。差不多得了，早点交班。"
